# microllm config - LiteLLM-kompatibles Format
# Reines Routing nach model_name, keine Format-Uebersetzung

general_settings:
  ocr_url: http://localhost:8019
  chatlog_dir: /tmp/microllm-chatlog

model_list:
  # GPU: GLM-4.7-Flash FP8 (vLLM, Anthropic + OpenAI API)
  - model_name: local
    litellm_params:
      model: hosted_vllm/glm-4.7-flash
      api_base: http://192.168.1.117:8011/v1
      api_key: dummy-key
      max_model_len: 100000

